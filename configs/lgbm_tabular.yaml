# Non-graph reference baseline: LightGBM on node features only (no edges).
# Same time-based masks as the graph models. See src/train_tabular.py.
run_name: "lgbm_tabular"
seed: 42
num_boost_round: 2000
early_stopping_rounds: 100
params:
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
